name: WoS Gift Codes (automático)

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wos-giftcodes
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar códigos y canjear
        run: node scripts/wos-giftcodes-auto.mjs

      - name: Guardar cambios
        run: |
          git config user.name "wos-giftcodes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gamers/wos/data
          if git diff --staged --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "chore(wos): actualizar códigos y canjes de alianza"
            git push
          fi
